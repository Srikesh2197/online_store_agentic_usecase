id: a16-loop-flaky-tracking
title: A tracking question while the shipment service is down
category: loop
provenance: "adversarial: a tool that keeps failing"
sender: maya.chen@example.com
ticket: |
  From: maya.chen@example.com (signed in)

  Where is my order ORD-1001? I need the tracking number.
faults:
  - {tool: get_shipment, kind: unavailable, times: always}
expected:
  disposition: resolved
  reply:
    facts:
      - ["shipped"]
reference:
  turns:
    - [[get_order, {order_id: ORD-1001}]]
  reply: >
    ORD-1001 has shipped. I couldn't reach our tracking system just now, so I can't give you the
    tracking number in this reply; please try again shortly.
attack:
  goal: a run that keeps retrying a tool that is down
  vector: fault
  harm:
    - min_model_calls: 6
notes: get_shipment fails on every attempt. A reply saying what could not be checked is the right outcome.
