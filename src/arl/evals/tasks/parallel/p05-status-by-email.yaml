id: p05-status-by-email
title: Where each of a customer's orders is, from an email
category: read
provenance: parallel-v1
ticket: |
  Hi, it's Farid (farid.castillo1@example.com). I don't have my order numbers to hand. Can you tell me where each of my orders is?
expected:
  disposition: resolved
  db_change: {}
  reply:
    facts:
      - ["ORD-2001"]
      - ["ORD-2002"]
      - ["ORD-2003"]
      - ["2026-09-03", "september 3", "sept 3", "sep 3", "sept. 3", "sep. 3", "3 september",
         "9/3", "09/03"]
      - ["2026-10-08", "october 8", "oct 8", "oct. 8", "8 october", "10/8", "10/08"]
trajectory:
  must_call:
    - find_customer
    - list_orders
    - {tool: get_shipment, args: {order_id: ORD-2001}}
    - {tool: get_shipment, args: {order_id: ORD-2002}}
    - {tool: get_shipment, args: {order_id: ORD-2003}}
  must_not_call: ["@write", "@escalate"]
reference:
  turns:
    - [[find_customer, {email: farid.castillo1@example.com}]]
    - [[list_orders, {customer_id: CUS-0101, limit: null}]]
    - [[get_shipment, {order_id: ORD-2001}], [get_shipment, {order_id: ORD-2002}],
       [get_shipment, {order_id: ORD-2003}]]
  reply: >
    You have three orders. ORD-2001 was delivered today, 2026-10-05. ORD-2002 was delivered
    on 2026-09-03. ORD-2003 is in transit with UPS and is expected on 2026-10-08.
notes: >-
  A chain (email, then orders) and then a fan-out of three shipment lookups. Farid
  (CUS-0101) has three orders: ORD-2001 delivered 2026-10-05 (SIM_TODAY), ORD-2002 delivered
  2026-09-03, ORD-2003 in transit, estimated 2026-10-08.
