[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arl"
version = "0.0.1"
description = "Agent Reliability Lab: a learning project on bounded, auditable, evaluated agents"
requires-python = ">=3.13"
# Versions are pinned in requirements/; these are the direct imports of sub-project 1.
dependencies = [
    "openai>=3.26,<4",
    "anthropic>=1.13,<2",
    "pydantic>=2.13,<3",
    "langfuse>=4.17,<5",
    "typer>=0.27,<1",
    "pyyaml>=6.0,<7",
    "tenacity>=9.2,<10",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# Sub-project 2 (Stages 6-7): what the framework strategies import. Pinned in
# requirements/framework.txt, which also lists the Stage 7 and 9 packages.
framework = [
    "langgraph>=1.2,<1.3",
    "langchain>=1.4,<1.5",
    "langchain-openai>=1.6,<2",
    "langchain-anthropic>=1.7,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",   # Stage 7: checkpoints for threads and evals
]

[project.scripts]
arl = "arl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"arl.env" = ["policy.md"]
"arl.evals" = ["tasks/*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
