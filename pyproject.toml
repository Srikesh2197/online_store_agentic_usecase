[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arl"
version = "0.0.1"
description = "Agent Reliability Lab: a learning project on bounded, auditable, evaluated agents"
requires-python = ">=3.13"
# Versions are pinned in requirements/; these are the direct imports of sub-project 1.
dependencies = [
    "openai>=3.26,<4",
    "anthropic>=1.13,<2",
    "pydantic>=2.13,<3",
    "langfuse>=4.17,<5",
    "typer>=0.27,<1",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
arl = "arl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"arl.env" = ["policy.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
