# Model ids and prices. Prices are US dollars per million tokens, standard tier,
# read from https://developers.openai.com/api/docs/pricing on 2026-10-11.
# Reasoning tokens are billed as output tokens.
default: gpt-6-luna

models:
  gpt-6-luna:
    provider: openai
    input: 0.10
    cached_input: 0.01
    output: 0.50
  gpt-5.6-luna:
    provider: openai
    input: 0.20
    cached_input: 0.02
    output: 1.20
  gpt-5-mini:
    provider: openai
    input: 0.25
    cached_input: 0.025
    output: 2.00
